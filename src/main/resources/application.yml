spring:
  profiles:
    default: local

  datasource:
    url: jdbc:h2:mem:~/cafekiosk
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  h2:
    console:
      enabled: true
